{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Удаление статьи</h2>

    <p>Ты точно хочешь удалить:</p>

    <h4>{{ blog.title }}</h4>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:blog_detail' blog.pk %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>
{% endblock %}
