<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Новости{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #000;
        }

        /* Header */
        .header {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            border-top: 1px solid #ddd;
            margin-top: 40px;
            padding: 20px 0;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="container header d-flex justify-content-between align-items-center">
    <div class="logo">
        Blog
    </div>

    <div class="new_create">
        <a href="create/"> Предложить новость</a>
    </div>

    <div class="nav">
        <a href=" ">Главная</a>
        <a href="#">Контакты</a>
        <a href="/">Магазин</a>
    </div>
</div>

<!-- CONTENT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<div class="container footer text-center">
    © 2026 Blog. Все права защищены.
</div>

</body>
</html>
