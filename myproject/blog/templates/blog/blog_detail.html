{% extends 'blog/base.html' %}
{% load my_tags %}

{% block content %}
<div class="container mt-4">

    <h1>{{ blog.title }}</h1>

    <p class="text-muted">
        {{ blog.created_at }} | 👁 {{ blog.views_count }}
    </p>

    {% if blog.preview %}
        <img src="{{ blog.preview|media_filter }}" class="img-fluid mb-3">
    {% endif %}

    <p>{{ blog.content }}</p>


    <div class="mt-4">
        <a href="{% url 'blog:blog_update' blog.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:blog_delete' blog.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад</a>
    </div>


</div>
{% endblock %}
