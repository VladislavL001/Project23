{% extends 'store/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
                <div class="container">
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                        {% for product in products %}
                        <div class="col">
                            <div class="card shadow-sm">
                                <img src="{{ product.image | media_filter }}">
                                    <div class="card-body">
                                        <p class="card-text">
                                            {{ product.name }}
                                        </p>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div class="btn-group">
                                                <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-sm btn-outline-secondary">Посмотреть</a>
                                                <a href="{% url 'store:category_products' product.category_id %}" class="btn btn-sm btn-outline-secondary">Товары категории</a>
                                            </div>
                                            <small class="text-body-secondary">9 mins</small>
                                        </div>
                                    </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
{% endblock %}
