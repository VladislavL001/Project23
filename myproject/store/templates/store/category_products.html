{% extends 'store/base.html' %}
{% load my_tags %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <h2 class="mb-4">Товары категории: {{ category.name }}</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in products %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.image|media_filter }}">
                    <div class="card-body">
                        <p class="card-text">{{ product.name }}</p>
                        <p class="card-text">Цена: {{ product.price }} руб</p>
                        <div class="btn-group">
                            <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-sm btn-outline-secondary">Посмотреть</a>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <p>В этой категории пока нет опубликованных товаров.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
