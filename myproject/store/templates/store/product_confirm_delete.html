{% extends 'store/base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Удаление товара</h2>

    <p>Ты точно хочешь удалить:</p>

    <h4>{{ product.name }}</h4>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>

{% endblock %}
